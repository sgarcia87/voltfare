<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoltFare</title></head>
<body><p>VoltFare tiene una única página principal. <a href="./">Abrir VoltFare</a></p>
<script>
(async function () {
  // Remove only VoltFare's former worker and shell, keeping all local trip data.
  try {
    if ('serviceWorker' in navigator) {
      const scope = new URL('./', location.href).href;
      for (const registration of await navigator.serviceWorker.getRegistrations()) {
        if (registration.scope === scope) await registration.unregister();
      }
    }
    if ('caches' in window) {
      for (const key of await caches.keys()) {
        if (key.startsWith('voltfare-shell-')) await caches.delete(key);
      }
    }
  } catch (error) { /* Navigation also works when browser storage is restricted. */ }
  location.replace('./');
})();
</script></body></html>
